<mat-sidenav-container>
  <mat-sidenav #sidenav mode="side" opened>
    <div>
      <button mat-button (click)="dojoService.onTrain('Bear')">Run Training Loop (Bear)</button>
    </div>

    <mat-form-field [formGroup]="dojoService.dojoFormGroup">
      <mat-label>Player</mat-label>
      <mat-select formControlName="playerFC">
        @for (pc of dojoService.playerCreatures; track pc) {
          <mat-option [value]="pc"> {{ pc.playerName }} - {{ pc.creatureName }} </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field [formGroup]="dojoService.dojoFormGroup">
      <mat-label>Enemy</mat-label>
      <mat-select formControlName="enemyFC">
        @for (ec of dojoService.enemyCreatures; track ec) {
          <mat-option [value]="ec"> {{ ec.playerName }} - {{ ec.creatureName }} </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-sidenav>

  <mat-sidenav-content>
    <button matButton (click)="sidenav.toggle()">sidenav.toggle()</button>

    <router-outlet></router-outlet>

  </mat-sidenav-content>
</mat-sidenav-container>
